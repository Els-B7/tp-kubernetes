apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: tp_kbn-b:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: URL_C
              valueFrom:
                configMapKeyRef:
                  name: chain-config
                  key: URL_C
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: lab
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - port: 8080
      targetPort: 8080
