apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: tp_kbn-a:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: URL_B
              valueFrom:
                configMapKeyRef:
                  name: chain-config
                  key: URL_B
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: chain-secret
                  key: APP_SECRET
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: lab
spec:
  type: ClusterIP
  selector:
    app: service-a
  ports:
    - port: 5000
      targetPort: 5000
